[package]
name = "epoch-worker"
version = "0.1.0"
edition = "2021"
description = "One ACE epoch session: inbound initialization, serving, outbound handoff, and grace."

[[bin]]
name = "epoch-worker"
path = "src/main.rs"

[lib]
name = "epoch_worker"
path = "src/lib.rs"

[dependencies]
vss-common = { path = "../vss-common" }
epoch-change-cur = { path = "../epoch-change-cur" }
epoch-change-nxt = { path = "../epoch-change-nxt" }
anyhow = "1"
bcs = "0.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
